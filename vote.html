<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081226">
<title>投我一票 · 交给我，你放100个percent心</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-layer" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-noise" aria-hidden="true"></div>
<div class="cursor-glow" id="glow" aria-hidden="true"></div>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="subpage">
  <div class="wrap wrap-narrow">
    <div class="sub-top rise rise-1">
      <a href="index.html" class="back"><i>←</i> 返回首页</a>
      <span class="sub-code">03 / VOTE</span>
    </div>

    <main>
      <div class="sec-head rise rise-2">
        <span class="no">03</span>
        <h1>投我一票</h1>
        <span class="deco">YOUR SUPPORT</span>
      </div>

      <section class="vote-box rise rise-3">
        <div class="vote-label">当前票数 / VOTES</div>
        <div class="vote-num" id="voteNum">5</div>
        <div class="vote-hint">LIVE COUNTING</div>

        <button class="btn-vote" id="voteBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
          投票支持
        </button>

        <p class="vote-note">每一票都是信任，我会用行动兑现承诺。</p>
      </section>

      <div class="rise rise-4" style="margin-top:36px">
        <a href="index.html" class="back"><i>←</i> 返回首页</a>
      </div>
    </main>
  </div>

  <footer class="foot">
    <span>CLASS / ELECTION · 2026</span>
    <span>03 / 投我一票</span>
  </footer>
</div>

<!-- 感谢弹窗 -->
<div class="popup" id="popup" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="popup-card">
    <div class="popup-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h2>感谢你的支持！</h2>
    <p>你的一票对我很重要</p>
    <button type="button" id="closePop">好的</button>
  </div>
</div>

<script>
(function () {
  /* ---------- 光晕 ---------- */
  var glow = document.getElementById('glow');
  var gx = 0, gy = 0, tx = 0, ty = 0, raf = null;
  function loop() {
    gx += (tx - gx) * 0.09; gy += (ty - gy) * 0.09;
    glow.style.transform = 'translate3d(' + gx + 'px,' + gy + 'px,0)';
    raf = requestAnimationFrame(loop);
  }
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    tx = e.clientX; ty = e.clientY;
    if (!document.body.classList.contains('has-pointer')) {
      document.body.classList.add('has-pointer');
      gx = tx; gy = ty;
    }
    if (!raf) loop();
  }, { passive: true });

  /* ---------- 票数 ---------- */
  var num = 5;
  var dom = document.getElementById('voteNum');
  var btn = document.getElementById('voteBtn');
  var pop = document.getElementById('popup');

  function paint(bump) {
    dom.textContent = num;
    if (bump) {
      dom.classList.add('bump');
      setTimeout(function () { dom.classList.remove('bump'); }, 380);
    }
  }

  setInterval(function () {
    num++;
    paint(true);
  }, 2000);

  /* ---------- 粒子 ---------- */
  var cvs = document.getElementById('fx');
  var ctx = cvs.getContext('2d');
  var parts = [];
  var running = false;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function sizeCanvas() {
    cvs.width = innerWidth * dpr;
    cvs.height = innerHeight * dpr;
    cvs.style.width = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  var COLORS = ['#67e8f9', '#22d3ee', '#3b82f6', '#a5b4fc', '#ffffff'];

  function burst(x, y) {
    for (var i = 0; i < 64; i++) {
      var a = (Math.PI * 2 * i) / 64 + Math.random() * 0.3;
      var sp = 2.4 + Math.random() * 7.6;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.6,
        life: 1,
        decay: 0.012 + Math.random() * 0.017,
        r: 1 + Math.random() * 2.6,
        c: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vx *= 0.975;
      p.vy *= 0.975;
      p.vy += 0.11;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parts.length) {
      requestAnimationFrame(tick);
    } else {
      running = false;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  /* ---------- 投票 ---------- */
  btn.addEventListener('click', function (e) {
    var r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);

    num++;
    paint(true);

    pop.classList.add('show');
    pop.setAttribute('aria-hidden', 'false');
    btn.disabled = true;
  });

  function closePop() {
    pop.classList.remove('show');
    pop.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('closePop').addEventListener('click', closePop);
  pop.addEventListener('click', function (e) {
    if (e.target === pop) closePop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePop();
  });
})();
</script>

<div class="flash-wipe" aria-hidden="true"></div>
<script>
(function () {
  var leaving = false;
  document.addEventListener('click', function (e) {
    if (leaving) return;
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#' || /^(https?:|mailto:|tel:|javascript:)/i.test(href)) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    leaving = true;
    document.body.classList.add('leaving');
    setTimeout(function () { location.href = href; }, 320);
  }, false);
})();
</script>

</body>
</html>
